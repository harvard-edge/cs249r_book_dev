<g id="concept-mlsys.tpot" class="node">
<title>mlsys.tpot</title>
<g id="a_concept-mlsys.tpot"><a xlink:title="For a request producing multiple tokens, its elapsed decoding time after the first output divided by its remaining generated-token count, summarizing average decoding speed at a declared measurement boundary.">
